<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name | Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="container">
    <div class="header-content">
      <div class="who">
        <img id="photo" class="photo" alt="" hidden>
        <div>
          <h1 id="name"></h1>
          <p id="title"></p>
        </div>
      </div>
      <div id="header-cta" class="header-cta"></div>
    </div>
  </div>
</header>

<main>
  <section class="about">
    <div class="container">
      <p id="bio"></p>
    </div>
  </section>

  <section class="projects">
    <div class="container">
      <h2>Featured Projects</h2>
      <div id="projects" class="cards-grid"></div>
    </div>
  </section>

  <section class="expertise">
    <div class="container">
      <h2>What I Do</h2>
      <div id="expertise" class="expertise-grid"></div>
    </div>
  </section>

  <section class="cta-section">
    <div class="container">
      <h2>Ready to start your next project?</h2>
      <a id="contact-link" class="btn-primary" href=""></a>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <p id="footer"></p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
